name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - if: matrix.node == 24
        run: npm run benchmark:storage
      - if: matrix.node == 24
        run: npm run test:soak -- ${{ github.event_name == 'schedule' && '300' || '60' }}
      - if: matrix.node == 24
        run: npm pack --dry-run
