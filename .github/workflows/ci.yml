name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - if: matrix.node == 24
        run: node --no-experimental-sqlite --test test/session-store.test.mjs
      - if: matrix.node == 24
        run: npm run benchmark:storage
      - if: matrix.node == 24
        run: npm run test:soak -- ${{ github.event_name == 'schedule' && '300' || '60' }}
      - if: matrix.node == 24
        run: npm run release:pack
      - if: matrix.node == 24
        run: npm run release:smoke
