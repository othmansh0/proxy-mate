name: Publish private package

on:
  push:
    tags: ['private-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@othmansh0'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: node --no-experimental-sqlite --test test/session-store.test.mjs
      - run: npm publish --registry=https://npm.pkg.github.com --access=restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
